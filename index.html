<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f2eb">
  <meta name="description" content="人物画像生成用の日本語指示文を端末内だけで作成するPWA">
  <title>神は7日で世界を作った</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="hero">
    <h1>神は7日で世界を作った</h1>
  </header>

  <main>
    <div class="layout">
      <form id="prompt-form" class="form-column" autocomplete="off"></form>

      <div class="output-column">
        <section class="card preset-card">
          <h2>プリセット</h2>
          <label for="preset-select">保存済み設定</label>
          <div class="preset-actions">
            <select id="preset-select"></select>
            <button id="delete-preset" class="button button-quiet" type="button">削除</button>
          </div>
          <label for="preset-name">現在の設定を保存</label>
          <div class="preset-actions">
            <input id="preset-name" maxlength="30" placeholder="例：白シャツ・スタジオ">
            <button id="save-preset" class="button button-secondary" type="button">保存</button>
          </div>
        </section>

        <section class="card output-card">
          <div class="output-heading">
            <h2>生成された指示文</h2>
            <span id="line-count" class="line-count"></span>
          </div>
          <textarea id="prompt-output" readonly aria-label="生成された指示文"></textarea>
          <div class="button-stack">
            <button id="copy-button" class="button button-primary" type="button">指示文をコピー</button>
            <button id="reset-button" class="button button-quiet" type="button">基準設定に戻す</button>
          </div>
          <p class="privacy">入力内容とプリセットはこの端末内だけに保存されます。</p>
        </section>
      </div>
    </div>
    <p class="pwa-catalog-link"><a href="./options.html">現在の選択項目・選択肢を見る</a></p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
